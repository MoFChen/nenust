name: Build PDFs and deploy Pages

on:
  push:
    branches: [master]
    paths-ignore: ['**.md', 'LICENSE']
  pull_request:
    branches: [master]
    paths-ignore: ['**.md', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: typst-community/setup-typst@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-pages.txt

      - name: 安装页面渲染依赖
        run: python -m pip install -r scripts/requirements-pages.txt

      - name: 构建预览站
        run: |
          python -m unittest discover -s scripts -p test_page_diff.py
          python scripts/build_pages.py

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
