<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f5ef"><title>nenust · 论文版式对照台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='7' fill='%23883b38'/%3E%3Cpath d='M9 30V10h5l12 15V10h5v20h-5L14 15v15z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./pages/preview.css"><script defer src="./pdf-versions.js"></script><script defer src="./pages/preview.js"></script>
</head>
<body>
<header class="mast"><div class="wrap mast-inner">
  <div class="brand"><span class="seal" aria-hidden="true">N</span><span>nenust<span class="brand-dot">.</span></span><span class="brand-sub">研究生学位论文模板</span></div>
  <nav aria-label="站点导航"><button id="library" type="button">示例目录 <span id="edition-count" class="count"></span></button><a href="https://github.com/MoFChen/nenust" target="_blank" rel="noopener">GitHub ↗</a></nav>
</div></header>
<main class="wrap">
  <div class="intro"><div><div class="kicker">THESIS ATLAS <i></i> 版式校样</div><h1>论文版式对照台<span>。</span></h1><p>选取两份配置，按章节对齐，直接查看发生变化的页面。</p></div>
    <div class="mode" aria-label="阅读模式"><button id="compare" type="button">双栏对照</button><button id="single" type="button">单份阅读</button></div>
  </div>
  <div id="error" role="status" hidden></div><noscript><p>请启用 JavaScript 查看差异，或<a href="tutorial.pdf">打开教程 PDF</a>。</p></noscript>
  <div id="app" hidden>
    <div class="presets" id="presets"><b>快速对照</b></div>
    <div class="workspace">
      <details id="navigator" class="rail" open><summary><span class="kicker">INDEX / 索引</span><span class="rail-title"><span id="nav-title">差异导航</span><span id="nav-count" class="count"></span></span></summary>
        <div class="rail-body"><label class="sr" for="filter">筛选差异</label><select id="filter"><option value="all">全部差异</option><option value="edit">内容或版式变化</option><option value="edge">仅页边变化</option><option value="gap">单侧独有页</option></select><div id="row-list" aria-label="页码索引"></div></div>
      </details>
      <section class="desk" aria-label="页面对照">
        <div class="position"><div><span id="badge" class="badge"></span><h2 id="section"></h2></div><div class="steppers"><button id="prev-diff" aria-label="上一处差异">‹ 上一处</button><button id="next-diff" aria-label="下一处差异">下一处 ›</button></div></div>
        <div class="tools"><div class="toggles"><label><input type="checkbox" id="mark" checked>标出变化</label><label><input type="checkbox" id="sync" checked>联动滚动与缩放</label></div><button id="swap">⇄ 互换版本</button><button id="copy">复制此页链接</button></div>
        <div class="mobile-sides" aria-label="查看版本"><button id="show-a">查看 A</button><button id="show-b">查看 B</button></div>
        <div id="panes" class="panes"></div>
        <p id="hint" class="hint" aria-live="polite"></p>
      </section>
    </div>
  </div>
</main>
<footer class="wrap"><span><b>nenust.</b> 东北师范大学研究生学位论文非官方模板</span><span>提交前请以学校及学院现行要求为准。</span></footer>
<dialog id="catalog"><div class="dialog-head"><div><span class="kicker">EDITION LIBRARY</span><h2>示例目录</h2></div><button id="close-lib" aria-label="关闭示例目录">✕</button></div>
  <label for="search">查找示例</label><input id="search" type="search" placeholder="按配置或类别搜索…"><div id="catalog-list"></div>
</dialog>
<template id="pane-template"><article class="pane"><div class="pane-head"><span class="letter"></span><select class="edition"></select><a class="download" download>下载 ↓</a></div>
  <div class="pager"><button class="previous" aria-label="上一页">‹</button><label>第 <input class="page-no" type="number" min="1" inputmode="numeric"> / <span class="total"></span> 页</label><button class="next" aria-label="下一页">›</button><div class="zoom"><button class="smaller" aria-label="缩小">−</button><span class="scale"></span><button class="larger" aria-label="放大">+</button></div></div>
  <div class="viewport" tabindex="0"><div class="sheet"><img alt=""><canvas aria-hidden="true" hidden></canvas></div><div class="absent" hidden></div></div>
  <div class="pane-foot"><span class="page-caption"></span><a class="open-pdf" target="_blank" rel="noopener">打开原 PDF ↗</a></div></article></template>
</body></html>
